name: Docker

# Builds and pushes the Immich images to the fork owner's GitHub Container Registry.
#
# Images produced:
#   ghcr.io/<owner>/immich-server:<tag>
#   ghcr.io/<owner>/immich-machine-learning:<tag>        (CPU)
#   ghcr.io/<owner>/immich-machine-learning:<tag>-rknn   (Rockchip NPU, arm64)
#
# Triggers:
#   - pushing a tag like v3.3.0
#   - manual dispatch (defaults to the "dev" tag)
#
# Only GHCR is used. No Docker Hub credentials are required.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: dev)'
        required: false
        type: string
      build_amd64:
        description: 'Also build linux/amd64 images (slower, uses QEMU)'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  # The target device is aarch64 (RK3588). Set build_amd64=true for x86 hosts.
  BUILD_PLATFORMS: ${{ github.event.inputs.build_amd64 == 'true' && 'linux/amd64,linux/arm64' || 'linux/arm64' }}

jobs:
  server:
    name: Build and push server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/immich-server
          tags: |
            type=semver,pattern={{raw}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=${{ github.event.inputs.tag || 'dev' }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ env.BUILD_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/immich-server
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=immich-server
          cache-to: type=gha,mode=max,scope=immich-server

  machine-learning:
    name: Build and push machine learning (${{ matrix.device }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: cpu
            suffix: ''
          - device: rknn
            suffix: '-rknn'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/immich-machine-learning
          flavor: |
            suffix=${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{raw}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && matrix.device == 'cpu' }}
            type=raw,value=${{ github.event.inputs.tag || 'dev' }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: machine-learning
          file: machine-learning/Dockerfile
          platforms: ${{ matrix.device == 'cpu' && env.BUILD_PLATFORMS || 'linux/arm64' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            DEVICE=${{ matrix.device }}
            BUILD_ID=${{ github.run_id }}
            BUILD_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/immich-machine-learning
            BUILD_SOURCE_REF=${{ github.ref_name }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=immich-ml-${{ matrix.device }}
          cache-to: type=gha,mode=max,scope=immich-ml-${{ matrix.device }}

  success:
    name: Docker images published
    needs: [server, machine-learning]
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          {
            echo "### Published images"
            echo ""
            echo "- \`ghcr.io/${{ env.IMAGE_OWNER }}/immich-server\`"
            echo "- \`ghcr.io/${{ env.IMAGE_OWNER }}/immich-machine-learning\`"
            echo "- \`ghcr.io/${{ env.IMAGE_OWNER }}/immich-machine-learning\` (tag suffix \`-rknn\`)"
          } >> "$GITHUB_STEP_SUMMARY"
